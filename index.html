<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Way2Loud</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="screen">
      <h1>Way2Loud</h1>
      <p id="zone-label" class="zone-label" aria-live="polite">&nbsp;</p>
      <div id="meter" class="meter" role="img" aria-label="Voice loudness">
        <div class="meter-fill"></div>
        <div class="meter-mark meter-mark-quiet"></div>
        <div class="meter-mark meter-mark-threshold"></div>
      </div>
      <div class="meter-legend" aria-hidden="true">
        <span>quiet</span>
        <span>normal voice</span>
        <span>too loud</span>
      </div>
      <p id="readout" class="readout" aria-live="off">– dB</p>
      <button id="toggle" class="button" type="button">Start</button>
      <p id="status" class="status" aria-live="polite">Loading…</p>
      <details class="settings">
        <summary>Settings</summary>
        <label class="setting" for="sensitivity">
          <span>Sensitivity <output id="sensitivity-value" for="sensitivity">0 dB</output></span>
          <input id="sensitivity" type="range" step="1" />
        </label>
        <p class="hint">
          Turn up if normal talking barely reaches the middle of the bar; down if it goes past the
          line.
        </p>
        <label class="setting setting-inline" for="chime">
          <span>Play a sound when too loud</span>
          <input id="chime" type="checkbox" />
        </label>
        <label class="setting" for="sound">
          <span>Sound</span>
          <select id="sound"></select>
        </label>
        <button id="test-chime" class="button button-small" type="button">Test sound</button>
        <label class="setting setting-inline" for="keep-screen-on">
          <span>Keep screen on while listening</span>
          <input id="keep-screen-on" type="checkbox" />
        </label>
        <p id="keep-screen-on-hint" class="hint">
          Some phones stop listening when the screen turns off. Turn this on if yours does.
        </p>
      </details>
      <p class="version">dev</p>
    </main>
  </body>
</html>
