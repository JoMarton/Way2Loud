name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # No build step: copy only the site files (no tests or config) into _site.
      - name: Collect site files
        run: |
          mkdir _site
          for f in index.html styles.css manifest.webmanifest sw.js js icons; do
            if [ -e "$f" ]; then cp -R "$f" _site/; fi
          done
      # Stamp the page so you can tell which deploy a device is showing.
      - name: Stamp version
        run: |
          stamp="v${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}"
          sed -i "s|<p class=\"version\">dev</p>|<p class=\"version\">${stamp}</p>|" _site/index.html
          grep -F "$stamp" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
