<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Way2Loud</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="screen">
      <h1>Way2Loud</h1>
      <div id="meter" class="meter" role="img" aria-label="Voice loudness">
        <div class="meter-fill"></div>
      </div>
      <p id="readout" class="readout" aria-live="off">– dB</p>
      <button id="toggle" class="button" type="button">Start</button>
      <p id="status" class="status" aria-live="polite">Loading…</p>
      <details class="settings">
        <summary>Settings</summary>
        <label class="setting" for="sensitivity">
          <span>Sensitivity <output id="sensitivity-value" for="sensitivity">0 dB</output></span>
          <input id="sensitivity" type="range" step="1" />
        </label>
        <p class="hint">Turn up if the bar barely moves when talking; down if it is always high.</p>
      </details>
    </main>
  </body>
</html>
